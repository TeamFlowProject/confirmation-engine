name: confirmation-engine

services:
  krakend:
    image: devopsfaith/krakend:2.7
    ports:
      - "${KRAKEND_PORT}:8080"
    volumes:
      - ./docker/krakend/krakend.json:/etc/krakend/krakend.json:ro
    env_file:
      - .env_krakend
    depends_on:
      confirmation-engine:
        condition: service_started
    networks:
      - backend

  confirmation-engine:
    build: .
    env_file:
      - .env_event_service
    ports:
      - "${EVENT_SERVICE_PORT}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16
    env_file:
      - .env_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    env_file:
      - .env_redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - "${REDPANDA_KAFKA_ADDR}"
      - --advertise-kafka-addr
      - "${REDPANDA_ADVERTISE_KAFKA_ADDR}"
      - --smp
      - "${REDPANDA_SMP}"
      - --memory
      - "${REDPANDA_MEMORY}"
      - --overprovisioned
      - --default-log-level=${REDPANDA_LOG_LEVEL}
    ports:
      - "${REDPANDA_EXTERNAL_PORT}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend

  redpanda-console:
    image: redpandadata/console:v2.6.0
    env_file:
      - .env_redpanda_console
    ports:
      - "${REDPANDA_CONSOLE_PORT}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
